[versions]
kotlin = "2.4.21"
compose-multiplatform = "1.12.2"
agp = "9.4.0"
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"
androidx-activityCompose = "1.11.0"
# JetBrains' multiplatform lifecycle artifacts version independently of AndroidX.
androidx-lifecycle = "2.11.0"
androidx-work = "2.10.0"
androidx-securityCrypto = "1.1.0-alpha06"
androidx-exifinterface = "1.4.2"
ktor = "3.6.1"
sqldelight = "2.4.0"
koin = "4.2.2"
coroutines = "1.11.0"
serialization = "1.9.0"
datetime = "0.7.1"
kamel = "1.0.7"
okio = "3.9.1"
coil = "3.6.3"
smbj = "0.14.0"
# NAS archive (M6): SFTP reaches the QNAP over the internet when SMB/WebDAV
# ports aren't forwarded, since SSH commonly already is. Both PhotoHub JVM
# targets (Android, desktop) can share one pure-JVM client.
sshj = "0.38.0"
# Vendored kmp-mega source (upstream 1.0.0-beta08, MIT) needs these directly.
kotlinx-io = "0.9.1"
bignum = "0.3.10"
cryptography = "0.5.0"
stately = "2.1.0"
# Pure-Java HEIC/HEIF decoder (M7): both JVM targets (Android, desktop) share
# one thumbnail path. Published to Aspose's Maven repo, not Maven Central.
# Its own transitive dependency (metadata-extractor, Apache 2.0) resolves
# from Maven Central as normal.
openize-heic = "26.5"

[libraries]
# Kotlinx
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }

# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-java = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
# Lets the Drive/OAuth clients be tested against scripted HTTP responses, with no network or real account.
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# SQLDelight
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-dialect-sqlite = { module = "app.cash.sqldelight:sqlite-3-38-dialect", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

# Coroutines (test + desktop UI dispatcher)
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }

# Image loading
kamel-image = { module = "media.kamel:kamel-image-default", version.ref = "kamel" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# Misc
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
smbj = { module = "com.hierynomus:smbj", version.ref = "smbj" }
sshj = { module = "com.hierynomus:sshj", version.ref = "sshj" }

# MEGA (M4), vendored from kmp-mega 1.0.0-beta08 (MIT) with a prelogin fix.
# The SDK version is pinned in source because upstream requires a salt field
# that MEGA omits for version-1 accounts.
bignum = { module = "com.ionspin.kotlin:bignum", version.ref = "bignum" }
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography" }
cryptography-provider-jdk = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk", version.ref = "cryptography" }
stately-concurrency = { module = "co.touchlab:stately-concurrency", version.ref = "stately" }

# HEIC/HEIF thumbnails (M7), pure Java, no native deps so both JVM targets
# share one decode path.
openize-heic = { module = "com.aspose:openize-heic", version.ref = "openize-heic" }

# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidx-securityCrypto" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidx-exifinterface" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinComposeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
